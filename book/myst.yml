# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 18e500f9-7350-4942-8959-c809aafedc5e
  title: Yuval's Intro to LLMs
  license: CC-BY-4.0
  # authors:
  #   - name: Yuval Shavit
  github: https://github.com/yshavit/llm-notes
  numbering: false
  exclude:
    - ".*.drawio.*"
    - "*.bkp"
    - "*.dtmp"
    - sidebar_footer.md
  plugins:
    - type: executable
      path: ../myst-plugins/drawio
    - type: executable
      path: ../myst-plugins/dfn
    - ../myst-plugins/mdash.mjs
    - ../myst-plugins/status.mjs
    - ../myst-plugins/emoji.mjs
  error_rules:
    - rule: link-resolves
      keys:
        - "https://platform.openai.com/tokenizer"
site:
  title: Yuval's Intro to LLMs
  template: book-theme
  options:
    logo_text: Intro to LLMs
    style: ./custom-style.css
  parts:
    primary_sidebar_footer: sidebar_footer.md
